<div class="oppia-filter-modal-container" [attr.dir]="modalDirection">
  <div class="oppia-filter-modal-header">
    <h3 class="oppia-filter-modal-title">{{filterOption === 'categories' ? 'Subjects' : 'Languages' }}</h3>
    <button class="close" (click)="dismiss()">&times;</button>
  </div>
  <div class="oppia-filter-modal-content">
    <span>Select options</span>
    <div class="oppia-filter-modal-grid">
      <mat-checkbox  class="oppia-filter-checkbox text-capitalize" *ngFor="let option of selectionDetails[filterOption].masterList"
      [(ngModel)]="selectionDetails[filterOption].selections[option.id]">
        {{ option.text | translate }}
      </mat-checkbox>
    </div>
  </div>
  <div class="oppia-filter-modal-footer">
    <button class="oppia-filter-modal-clearall" (click)="deselectAll(filterOption)">Clear All</button>
    <button class="oppia-filter-modal-save" (click)="close()">Save</button>
  </div>
</div>
<style>
  .oppia-filter-modal-container {
    background-color: #e4e7ec;
    border-radius: 4px;
    padding: 0 30px;
  }
  .oppia-filter-modal-header {
    display: flex;
    justify-content: space-between;
    padding: 20px 0;
  }

  .oppia-filter-modal-content {
    background-color: #fff;
    border-radius: 4px;
    font-size: 16px;
    margin-bottom: 1px;
    padding: 15px 25px 2px 25px;
    text-align: start;
  }

  .oppia-filter-modal-content > span {
    color: #333;
  }

  .oppia-filter-modal-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0;
  }

  .oppia-filter-modal-grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(3, 1fr);
    margin: 5px 0;
    max-height: 250px;
    overflow-y: auto;
    padding: 10px 0 20px 0;
  }
  .oppia-filter-modal-grid::-webkit-scrollbar {
    background: #5b5b5b;
    border-radius: 6px;
    height: 100%;
    width: 6px;
  }
  .oppia-filter-modal-grid::-webkit-scrollbar-thumb {
    background: #0a6e66;
    border-radius: 6px;
  }

  .oppia-filter-checkbox {
    align-items: baseline;
    display: flex;
    font-weight: 400;
    margin-bottom: 1px;
  }

  .mat-checkbox-checked.mat-accent .mat-checkbox-background {
    background-color: #00645c;
  }

  .oppia-filter-modal-footer {
    display: flex;
    gap: 30px;
    justify-content: flex-end;
    padding: 20px 0;
  }

  .oppia-filter-modal-clearall {
    border: 1px solid #00645c;
    border-radius: 4px;
    color: #00645c;
    font-size: 2rem;
    font-weight: 700;
    height: 48px;
    padding: 8px 16px;
    width: 120px;
  }

  .oppia-filter-modal-save {
    background-color: #00645c;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 2rem;
    font-weight: 700;
    height: 48px;
    padding: 8px 16px;
    width: 120px;
  }

  .close {
    background: none;
    border: none;
    color: #000;
    cursor: pointer;
    font-size: 3rem;
  }

  @media (max-width:767px) {
    .oppia-filter-modal-container {
      padding: 0 15px;
    }

    .oppia-filter-modal-header > h3 {
      font-size: 28px;
      margin-bottom: 5px;
      margin-inline-start: 10px;
    }

    .oppia-filter-modal-content {
      height: 550px;
      padding-block-end: 2px;
      padding-block-start: 15px;
      padding-inline-end: 15px;
      padding-inline-start: 35px;
    }

    .oppia-filter-modal-grid {
      grid-template-columns: repeat(1, 1fr);
      max-height: 485px;
    }

    .oppia-filter-checkbox {
      margin-bottom: 2px;
    }

    .oppia-filter-modal-footer {
      justify-content: space-evenly;
    }

    .oppia-filter-modal-footer > button {
      height: 52px;
      width: 130px;
    }
  }
</style>
